<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Huynh trưởng — Sổ Thiếu Nhi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <link rel="stylesheet" href="/shared/style.css">
</head>

<body class="bg-slate-100 min-h-screen" data-title="🧑‍🏫 Quản Lý Huynh trưởng"
  data-sub="Điểm danh · Trích lục · Thống kê Huynh trưởng theo Ngành — BQT ngành / Xứ đoàn"
  data-role="exec">

  <div id="shell"></div>

  <div class="max-w-7xl mx-auto px-4 pb-6">
    <div class="bg-white rounded-t-xl border-b border-slate-300 shadow-sm px-4 pt-2 flex flex-wrap">
      <button class="tab-btn active" data-tab="t-attendance">📝 Điểm Danh</button>
      <button class="tab-btn" data-tab="t-absences">🔎 Trích Lục</button>
      <button class="tab-btn" data-tab="t-stats">📊 Thống Kê</button>
      <button class="tab-btn" data-tab="t-users">👤 Huynh trưởng</button>
    </div>

    <!-- t-gvdd -->
    <div id="t-attendance" class="bg-white rounded-b-xl shadow-sm p-5" data-pane>
      <!-- Hai giao diện: bảng (cũ) và thẻ (mới, .v2 trên #t-attendance), như trang Chuyên cần. -->
      <div class="att-top mb-6 bg-slate-50 p-4 rounded-lg border border-slate-200">
        <div class="att-filters grid grid-cols-1 md:grid-cols-3 gap-4">
          <div><label class="v1-only block text-xs font-bold text-slate-600 uppercase mb-1">Ngành</label>
            <div class="flex gap-2">
              <select id="ta-sector" class="w-full min-w-0 border p-2.5 rounded-lg font-semibold"></select>
              <!-- Đổi giao diện bảng/thẻ; lựa chọn được nhớ trên trình duyệt này -->
              <button id="ta-view" type="button"
                class="flex-none bg-white hover:bg-blue-50 border border-blue-300 text-blue-800 font-bold px-3 rounded-lg text-sm whitespace-nowrap"></button>
            </div>
          </div>
          <div><label id="ta-week-label" for="ta-week"
              class="block text-xs font-bold text-slate-600 uppercase mb-1">Tuần (Chủ Nhật)</label>
            <div class="flex gap-2">
              <button id="ta-prev" type="button" title="Tuần trước"
                class="v2-only bg-slate-200 hover:bg-slate-300 text-slate-700 text-xl font-extrabold px-3 rounded-lg">‹</button>
              <input type="date" id="ta-week" data-week-label="ta-week-label"
                class="w-full min-w-0 border p-2.5 rounded-lg font-semibold">
              <button id="ta-next" type="button" title="Tuần sau"
                class="v2-only bg-slate-200 hover:bg-slate-300 text-slate-700 text-xl font-extrabold px-3 rounded-lg">›</button>
            </div>
          </div>
          <div class="v1-only"><label class="block text-xs font-bold text-slate-600 uppercase mb-1">Buổi Sinh Hoạt</label>
            <select id="ta-session" class="w-full border p-2.5 rounded-lg font-semibold"></select>
          </div>
        </div>

        <!-- Thẻ: chọn buổi bằng một chạm; chấm xanh = buổi đã có điểm danh trong tuần -->
        <div id="ta-tabs" class="v2-only grid grid-cols-5 gap-1 mt-2"></div>

        <!-- Thanh công cụ điểm danh: thêm nút mới vào đây (.v1-only = chữ đầy đủ, .v2-only = chữ ngắn). -->
        <div class="att-actions grid grid-cols-2 gap-2 mt-4 sm:flex sm:flex-wrap">
          <button id="ta-markall" title="Chọn hiện diện tất cả"
            class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-3 py-3 sm:py-2 rounded-lg text-sm">✅ <span
              class="v1-only">Hiện diện tất cả</span><span class="v2-only">Tất cả</span></button>
          <button id="ta-unmarkall" title="Bỏ chọn tất cả"
            class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-3 py-3 sm:py-2 rounded-lg text-sm">⬜ <span
              class="v1-only">Bỏ chọn tất cả</span><span class="v2-only">Bỏ hết</span></button>
        </div>
      </div>

      <div id="ta-holiday-note" style="display:none"></div>

      <div class="v1-only tbl-scroll sticky">
        <table class="w-full text-sm border-collapse min-w-[820px]">
          <thead>
            <tr class="bg-blue-900 text-white text-xs uppercase font-bold text-center">
              <th class="p-3 admin-only">Email</th>
              <th class="p-3">Họ Tên</th>
              <th class="p-3">Lớp</th>
              <th class="p-3">Hiện Diện</th>
              <th class="p-3">Có Phép</th>
            </tr>
          </thead>
          <tbody id="ta-tbody"></tbody>
        </table>
      </div>

      <div id="ta-cards" class="v2-only grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2"></div>

      <div class="att-bottom mt-5 flex justify-between items-center flex-wrap gap-3">
        <div class="flex gap-3 flex-wrap items-center">
          <span class="att-summary font-bold text-slate-700" id="ta-summary"></span>
          <span id="ta-dirty"
            class="att-dirty bg-amber-100 border border-amber-400 text-amber-800 font-bold px-3 py-1.5 rounded-lg"
            style="display:none">⚠ <span class="v1-only">Có thay đổi chưa lưu</span><span class="v2-only">Chưa lưu</span></span>
        </div>
        <div class="att-bottom-actions flex gap-3 flex-wrap">
          <button id="ta-refresh" title="Làm mới"
            class="att-refresh bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-5 py-3 rounded-lg">↻<span class="v1-only"> Làm mới</span></button>
          <button id="ta-save"
            class="att-save bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-8 py-3 rounded-lg">💾 Lưu Điểm
            Danh</button>
        </div>
      </div>
    </div>

    <!-- t-gvtrich -->
    <div id="t-absences" class="bg-white rounded-b-xl shadow-sm p-5" style="display:none" data-pane>
      <div
        class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6 bg-slate-50 p-4 rounded-lg border border-slate-200 items-end">
        <div class="md:col-span-2"><label class="block text-xs font-bold text-slate-600 uppercase mb-1">Họ tên đầy đủ của Huynh trưởng <span class="admin-only">(hoặc email)</span></label>
          <input type="text" id="tabs-query" class="w-full border p-2.5 rounded-lg font-semibold"
            placeholder="vd: Giuse Trần Văn Bình">
        </div>
        <div class="flex gap-3">
          <button id="tabs-search"
            class="bg-blue-900 hover:bg-blue-800 text-white font-bold px-6 py-2.5 rounded-lg flex-1">🔎 Tra cứu</button>
        </div>
      </div>
      <div id="tabs-out"></div>
    </div>

    <!-- t-gvtk -->
    <div id="t-stats" class="bg-white rounded-b-xl shadow-sm p-5" style="display:none" data-pane>
      <div
        class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-[repeat(4,minmax(0,1fr))_auto] gap-4 mb-6 bg-slate-50 p-4 rounded-lg border border-slate-200 items-end">
        <div><label class="block text-xs font-bold text-slate-600 uppercase mb-1">Ngành</label>
          <select id="ts-sector" class="w-full border p-2.5 rounded-lg font-semibold"></select>
        </div>
        <div><label class="block text-xs font-bold text-slate-600 uppercase mb-1">Lớp</label>
          <select id="ts-class" class="w-full border p-2.5 rounded-lg font-semibold"></select>
        </div>
        <div><label for="ts-from" class="block text-xs font-bold text-slate-600 uppercase mb-1">Từ ngày</label>
          <input type="date" id="ts-from" class="w-full border p-2.5 rounded-lg font-semibold"></div>
        <div><label for="ts-to" class="block text-xs font-bold text-slate-600 uppercase mb-1">Đến ngày</label>
          <input type="date" id="ts-to" class="w-full border p-2.5 rounded-lg font-semibold"></div>
        <div class="flex items-end gap-3">
          <button id="ts-excel"
            class="bg-emerald-700 hover:bg-emerald-800 text-white font-bold px-6 py-2.5 rounded-lg whitespace-nowrap">⬇ Excel</button>
          <button id="ts-print" class="bg-slate-700 hover:bg-slate-800 text-white font-bold px-6 py-2.5 rounded-lg whitespace-nowrap">🖨 PDF</button>
        </div>
        <div id="ts-sessions" class="col-span-full flex flex-wrap gap-x-5 gap-y-1"></div>
      </div>
      <div class="tbl-scroll sticky">
        <table class="w-full text-sm border-collapse min-w-[960px]" id="ts-table">
          <thead>
            <tr class="bg-blue-900 text-white text-xs uppercase font-bold text-center">
              <th class="p-3">Họ Tên</th>
              <th class="p-3">Lớp</th>
              <th class="p-3">Buổi dạy</th>
              <th class="p-3" data-session="SUNDAY_MASS">Lễ CN</th>
              <th class="p-3" data-session="CATECHISM">Học GL</th>
              <th class="p-3" data-session="ADORATION">Chầu TT</th>
              <th class="p-3" data-session="THURSDAY_MASS">Lễ T5</th>
              <th class="p-3" data-session="TEACHER_MEETING">Họp HT</th>
              <th class="p-3">Tỉ lệ hiện diện</th>
            </tr>
          </thead>
          <tbody id="ts-tbody"></tbody>
        </table>
      </div>
    </div>

    <!-- t-users: Huynh trưởng của ngành — chỉ cập nhật, thêm mới ở trang Quản trị -->
    <div id="t-users" class="bg-white rounded-b-xl shadow-sm p-5" style="display:none" data-pane>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4 bg-slate-50 p-4 rounded-lg border border-slate-200 items-end">
        <div><label class="block text-xs font-bold text-slate-600 uppercase mb-1">Ngành</label>
          <select id="tu-sector" class="w-full border p-2.5 rounded-lg font-semibold"></select>
        </div>
        <div class="md:col-span-2"><label class="block text-xs font-bold text-slate-600 uppercase mb-1">Tìm theo họ tên đầy đủ <span class="admin-only">hoặc email</span> (để trống: hiện tất cả)</label>
          <input type="text" id="tu-query" class="w-full border p-2.5 rounded-lg font-semibold" placeholder="vd: Nguyễn Văn A">
        </div>
      </div>
      <div class="tbl-scroll sticky">
        <table class="w-full text-sm border-collapse">
          <thead><tr class="bg-blue-900 text-white text-xs uppercase font-bold text-center">
            <th class="p-3 admin-only">Email</th><th class="p-3">Họ Tên</th><th class="p-3">SDT</th><th class="p-3">Lớp</th><th class="p-3">Trạng thái</th><th class="p-3"></th>
          </tr></thead>
          <tbody id="tu-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal: cập nhật Huynh trưởng của ngành (không đổi email) -->
  <div id="tu-modal" class="modal">
    <div class="modal-content">
      <h3 id="tu-title">Cập nhật Huynh trưởng</h3>
      <div class="form-grid">
        <div class="form-group"><label>Tên Thánh</label><input id="tu-saint" type="text"></div>
        <div class="form-group"><label>Họ Và Tên *</label><input id="tu-fullname" type="text"></div>
        <div class="form-group"><label>SDT</label><input id="tu-phone" type="text" placeholder="vd: 0912 345 678"></div>
        <div class="form-group"><label>Trạng Thái</label><select id="tu-status"></select></div>
        <div class="form-group full"><label>Lớp trong ngành (chọn nhiều)</label>
          <div id="tu-groups" class="grid grid-cols-1 sm:grid-cols-2 gap-1 max-h-56 overflow-y-auto border rounded-lg p-2 bg-slate-50"></div>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-cancel">Hủy</button>
        <button type="button" class="btn-save">Lưu</button>
      </div>
    </div>
  </div>

  <script type="module" src="teachers.js"></script>
</body>

</html>
