<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản lý học vụ - Giảng Dạy</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/shared/style.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-100 min-h-screen"
      data-title="📕 Giảng Dạy"
      data-sub="Trong tuần: Giáo lý viên cập nhật bài học & giáo án | Ban quản trị theo dõi & quản lý"
      data-back="1"
      data-role="any">

<div id="shell"></div>

<div class="max-w-7xl mx-auto px-4 pb-6">
  <!-- TABS (Restored original classes so common.js script works) -->
  <div class="bg-white rounded-t-xl border-b border-slate-300 shadow-sm px-4 pt-2 flex flex-wrap gap-2">
    <button class="tab-btn active" data-tab="t-week">📅 Lịch Theo Tuần</button>
    <button class="tab-btn" data-tab="t-gdstats">📊 Thống Kê Theo Lớp</button>
  </div>

  <!-- WEEK PANE (Unchanged) -->
  <div id="t-week" class="bg-white rounded-b-xl shadow-sm p-5" data-pane>
    <div class="flex justify-between items-center flex-wrap gap-3 mb-5">
      <label class="gd-title flex items-center gap-2">Chủ Nhật Tuần:
        <input type="date" id="gd-week" class="border p-2 rounded-lg font-semibold">
      </label>
      <span class="summary-badge" id="gd-summary"></span>
    </div>
    <div class="grid-classes" id="cards"></div>
  </div>

  <!-- STATS PANE (New 1/3 and 2/3 Layout using pure Tailwind) -->
  <div id="t-gdstats" class="bg-white rounded-b-xl shadow-sm p-5" style="display:none" data-pane>
    
    <!-- Filter Bar (Top) -->
    <div class="bg-slate-50 rounded-xl p-4 mb-5 flex justify-between items-center flex-wrap gap-3 border border-slate-200">
      <div class="flex items-center gap-3">
        <label class="font-bold text-slate-700 text-sm">Chọn Lớp Cần Xem:</label>
        <select id="gd-cls" class="border border-slate-300 p-2 rounded-lg font-semibold text-sm outline-none focus:border-blue-500 min-w-[180px]"></select>
      </div>
      <div class="bg-slate-200 text-slate-700 font-semibold px-4 py-1.5 rounded-full text-sm" id="gd-total-updates">
        Tổng số buổi đã cập nhật: 0
      </div>
    </div>

    <!-- Dashboard Grid (1/3 and 2/3 Split) -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
      
      <!-- Left Card: Tần Suất Dạy -->
      <div class="card lg:col-span-1 !border-t-0 !shadow-none border border-slate-200 h-fit p-5">
        <h3 class="gd-title flex items-center gap-2 mb-4 text-blue-900 border-b border-slate-100 pb-3 mt-0">🏆 Tần Suất Dạy</h3>
        <ul class="freq-list" id="gd-freq"></ul>
      </div>
      
      <!-- Right Card: Lịch Sử Giảng Dạy -->
      <div class="card lg:col-span-2 !border-t-0 !shadow-none border border-slate-200 p-5">
        <h3 class="gd-title flex items-center gap-2 mb-4 text-blue-900 border-b border-slate-100 pb-3 mt-0">📖 Lịch Sử Giảng Dạy Chi Tiết</h3>
        <div class="tbl-scroll w-full overflow-x-auto">
          <table class="history-table w-full text-sm">
          <thead>
            <tr class="border-b border-slate-200">
              <th class="text-left py-2 font-bold text-slate-700 bg-transparent text-sm whitespace-nowrap">Ngày dạy</th>
              <th class="text-left py-2 font-bold text-slate-700 bg-transparent text-sm whitespace-nowrap">Lớp</th>
              <th class="text-left py-2 font-bold text-slate-700 bg-transparent text-sm whitespace-nowrap">Giáo lý viên</th>
              <th class="text-left py-2 font-bold text-slate-700 bg-transparent text-sm whitespace-nowrap">Bài học</th>
              <th class="text-center py-2 font-bold text-slate-700 bg-transparent text-sm whitespace-nowrap">Giáo án</th>
              <th class="text-center py-2 font-bold text-slate-700 bg-transparent text-sm whitespace-nowrap">Bản chỉnh sửa</th>
              <th class="text-left py-2 font-bold text-slate-700 bg-transparent text-sm whitespace-nowrap">Người cập nhật</th>
            </tr>
          </thead>
          <tbody id="gd-history"></tbody>
        </table>
        </div>
        <div class="pager mt-4 flex justify-end" id="gd-pager"></div>
      </div>
      
    </div>
  </div>
</div>

<!-- MODAL (Unchanged) -->
<div class="modal" id="gd-modal">
  <div class="modal-content">
    <h2 id="gd-modal-title" class="gd-title">Cập nhật giảng dạy</h2>
    <div class="form-group"><label>Giáo lý viên (lưu lần đầu):</label><input type="text" id="gd-teacher" readonly></div>
    <div class="form-group"><label>Nội dung / Tên bài học Chúa Nhật:</label><textarea id="gd-lesson" rows="3" placeholder="vd: Chúa là ánh sáng"></textarea></div>
    <div class="form-group">
      <label>📄 Giáo án / Tài liệu (GLV):</label>
      <div class="file-list" id="plan-list"></div>
      <div class="file-add-row">
        <label class="file-add" for="f-plan">＋ Thêm tài liệu</label>
        <input type="file" id="f-plan" multiple hidden>
      </div>
    </div>
    <div class="form-group" style="border-top:1px dashed #e2e8f0;padding-top:.8rem">
      <label style="color:#8e44ad">✏️ Giáo án đã chỉnh sửa (Trưởng bộ môn):</label>
      <div class="file-list" id="rev-list"></div>
      <div class="file-add-row">
        <label class="file-add" for="f-rev" style="color:#8e44ad;border-color:#8e44ad">＋ Thêm bản chỉnh sửa</label>
        <input type="file" id="f-rev" multiple hidden>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel">Hủy</button>
      <button class="btn-save">💾 Lưu &amp; Upload Giáo Án</button>
    </div>
  </div>
</div>

<script type="module" src="giangday.js"></script>
</body>
</html>
