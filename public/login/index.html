<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập — Sổ Thiếu Nhi</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/shared/style.css">
</head>
<body class="bg-slate-100 min-h-screen">

<div class="gate">
  <div class="gate-box" style="text-align:center">
    <div class="gate-icon">
     <img src="../../logo.png" alt="TNTT Nghĩa Hòa" class="h-9 w-9 rounded-lg">
    </div>
    <h2 style="margin:.2rem 0">Quản lý học vụ</h2>
    <p style="color:#64748b;margin:0;font-size:.85rem">Giáo xứ Nghĩa Hòa</p>
    <div id="login-status" style="margin-top:1.1rem;font-size:.85rem;color:#475569">Đang kiểm tra phiên đăng nhập…</div>
    <div id="login-error" style="display:none;margin-top:.8rem;text-align:left;background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:8px;padding:.7rem;font-size:.82rem"></div>
    <div id="login-btn" style="display:none;margin-top:1.1rem">
      <a href="/auth/google" style="display:block;width:100%;background:#1e3c72;color:#fff;text-decoration:none;border-radius:8px;padding:.7rem;font-size:1rem;font-weight:700;text-align:center">🔑 Đăng nhập bằng Google</a>
    </div>
  </div>
</div>

<script type="module" src="login.js"></script>
</body>
</html>
