<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giáo Viên — Sổ Thiếu Nhi</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="stylesheet" href="/shared/style.css">
</head>
<body class="bg-slate-100 min-h-screen"
      data-title="🧑‍🏫 Quản Lý Giáo Viên"
      data-sub="Điểm danh giáo viên theo ngành · Thống kê — BCH ngành / Xứ đoàn (403 cho nhóm khác)"
      data-back="1"
      data-role="any">

<div id="shell"></div>

<div class="max-w-7xl mx-auto px-4 pb-6">
  <div class="bg-white rounded-t-xl border-b border-slate-300 shadow-sm px-4 pt-2 flex flex-wrap">
    <button class="tab-btn active" data-tab="t-gvdd">📝 Điểm Danh Giáo Viên</button>
    <button class="tab-btn" data-tab="t-gvtk">📊 Thống Kê</button>
  </div>

  <div id="t-gvdd" class="bg-white rounded-b-xl shadow-sm p-5" data-pane>
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6 bg-slate-50 p-4 rounded-lg border border-slate-200">
      <div><label class="block text-xs font-bold text-slate-600 uppercase mb-1">Ngành</label>
        <select id="gvdd-nganh" class="w-full border p-2.5 rounded-lg font-semibold"></select></div>
      <div><label class="block text-xs font-bold text-slate-600 uppercase mb-1">Tuần (Chủ Nhật)</label>
        <input type="date" id="gvdd-week" class="w-full border p-2.5 rounded-lg font-semibold"></div>
      <div><label class="block text-xs font-bold text-slate-600 uppercase mb-1">Buổi Sinh Hoạt</label>
        <select id="gvdd-session" class="w-full border p-2.5 rounded-lg font-semibold"></select></div>
      <div class="flex items-end"><button id="gvdd-save" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2.5 rounded-lg">💾 Lưu Điểm Danh</button></div>
    </div>
    <div style="overflow-x:auto">
      <table class="w-full text-sm border-collapse">
        <thead><tr class="bg-blue-900 text-white text-xs uppercase font-bold text-center">
          <th class="p-3">STT</th><th class="p-3">Email</th><th class="p-3">Họ Tên</th><th class="p-3">Hiện Diện</th><th class="p-3">Có Phép</th><th class="p-3">Ghi Chú</th>
        </tr></thead>
        <tbody id="gvdd-tbody"></tbody>
      </table>
    </div>
    <p class="text-xs text-slate-500 mt-3" id="gvdd-summary"></p>
    <p class="text-xs text-slate-500 mt-3">BCH ngành chỉ thấy ngành mình; Xứ đoàn thấy mọi ngành; nhóm khác bị từ chối 403 (FR-GV-04).</p>
  </div>

  <div id="t-gvtk" class="bg-white rounded-b-xl shadow-sm p-5" style="display:none" data-pane>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6 bg-slate-50 p-4 rounded-lg border border-slate-200">
      <div><label class="block text-xs font-bold text-slate-600 uppercase mb-1">Ngành</label>
        <select id="gvtk-nhom" class="w-full border p-2.5 rounded-lg font-semibold"></select></div>
      <div class="flex items-end"><button id="gvtk-excel" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold px-4 py-2.5 rounded-lg">⬇ Xuất Excel</button></div>
    </div>
    <div style="overflow-x:auto">
      <table class="w-full text-sm border-collapse" id="gvtk-table">
        <thead><tr class="bg-blue-900 text-white text-xs uppercase font-bold text-center">
          <th class="p-3">Giáo viên</th><th class="p-3">Buổi dạy đã cập nhật (tab Giảng dạy)</th><th class="p-3">Tỷ lệ hiện diện</th>
        </tr></thead>
        <tbody id="gvtk-tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<script type="module" src="giaovien.js"></script>
</body>
</html>
