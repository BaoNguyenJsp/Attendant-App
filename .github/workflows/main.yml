name: Wake Up Service

on:
  schedule:
    - cron: '0 5 * * 4'    # 12:00 PM Vietnam time (Thursday) = 05:00 UTC
    - cron: '0 17 * * 6'   # 12:00 AM Vietnam time (Sunday) = 17:00 UTC (Saturday UTC)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive ping
        run: |
          curl -Is "https://nghiahoa.onrender.com/wakeup" | head -n 1
