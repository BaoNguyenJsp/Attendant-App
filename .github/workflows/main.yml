name: Wake Up Service

on:
  schedule:
    - cron: '30 11 * * 4'   # 6:30 PM Vietnam time = 11:30 UTC
    - cron: '30 11 * * 0'   # 6:30 PM Vietnam time = 11:30 UTC
    - cron: '30 23 * * 0'   # 6:30 AM Vietnam time = 23:30 UTC previous day
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive ping
        run: |
          curl -Is "https://nghiahoa.onrender.com/wakeup" | head -n 1
