name: Thursday Wake Up Service

on:
  schedule:
    # Runs every Thursday at 09:15 UTC (which is 4:15 PM in HCMC / Vietnam time)
    - cron: '15 9 * * 4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive ping
        run: |
          curl -Is "https://nghiahoa.onrender.com/wakeup" | head -n 1
